name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verificaciones básicas (sintaxis, JSON, secretos, HTML autónomo)
        run: npm run check
      - name: Pruebas automatizadas
        run: npm test
      - name: Los experimentos guardados se reproducen
        run: npm run experiments -- --check
